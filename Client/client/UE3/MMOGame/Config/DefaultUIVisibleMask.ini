;当自己的排斥位与别人的排斥位&操作为1时，作为排斥处理，后出现的会顶掉先出现的UI
;ExclusiveVisibilityMask 自己的排斥位, 可用位1,2,4,8,16,32,64,128,256,512,1024等2的N次方，N小于等于32
;ExclusiveWithVisibilityMask 别人的排斥位,可以是一个位，或者用上面的位去组合

;当自己的共存位与别人的共存位&操作为1时，作为共存处理，会显示所有共存位相同的UI
;CoexistVisibilityMask 自己的共存位, 可用位1,2,4,8,16,32,64,128,256,512,1024等2的N次方，N小于等于32
;CoexistWithVisibilityMask 别人的共存位

;所有的交易相关界面都不能共存，所有参与消耗材料的界面不共存。
;包裹的排斥位为1。交易、强化类相关界面排斥位为2。系统功能界面排斥位为4。对话排斥位为8。

;if(cmpUI->ExclusiveVisibilityMask & ui->ExclusiveWithVisibilityMask)
;{
;	if(cmpUI->IsVisible)
;	{
;		cmpUI->Show(FALSE);
;	}
;}
;else if(cmpUI->CoexistVisibilityMask & ui->CoexistWithVisibilityMask)
;{
;	if(!cmpUI->IsVisible)
;	{
;		cmpUI->Show(TRUE);
;	}
;}

