-Bindings=(Name="R",Command="STARTMOVIECAPTURE",Alt=True)
-Bindings=(Name="X",Command="ReturnSelectHotKey",Alt=True)
-Bindings=(Name="R",Command="STOPMOVIECAPTURE",Shift=True)

