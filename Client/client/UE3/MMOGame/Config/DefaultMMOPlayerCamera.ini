[MMOGame.MMOPlayerCamera]
;默认的距离比例(0最近 1最远 线性插值)
DistanceRatio=1

;最大的相机距离与最近距离（差值）
NearCameraDistance=1000
FarCameraDistance=2800

;Yaw偏移值(左右方向，角度)
CameraYawOffset=45

;Pitch偏移值(上下方向，角度)
NearCameraPitch=18
FarCameraPitch=43

;目标点位置偏移,屏幕上下值(像素，角度)
NearCameraLookAtOffset=50
FarCameraLookAtOffset=120

;最远距离时的FOV(角度)
NearFov=45
FarFov=45


;近距离Dof配置
EnableNearDof=TRUE
NearDofFocusDistance=1600
NearDofFocusRadius=1000
NearDofFalloffExponent=0.6
NearDofMaxFarBlurAmount=0.8
NearDofFarBlurKernelSize=1


;左右摇摆速度（角度/秒）
DefaultYawSpeed=45
;上下摇摆速度（角度/秒）
DefaultPitchSpeed=45
;相机跟随指数参数 为与相机目标距离的指数次幂，1为初始值，即速度与距离成简单的线性关系，越远越快,建议不要超过2.0）
;DefaultMovePow=4.0
;相机是否开始平滑跟随
DefaultSmoothMove=False
;相机跟随速度倍速
DefaultMoveSpeed=450.0 
;相机跟随拉近的百分比
DefaultMoveScale=1.0
;是否绘制Debug信息
EnableDebugMode=FALSE

;阻挡物体的消隐速度
BlockObjectFadeInOutSpeed=0.4

;阻挡检查的范围
TraceExtend=(X=60,Y=60,Z=150)