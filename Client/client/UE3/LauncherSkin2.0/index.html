<script type="text/javascript">
    $(document).ready(function() {
	    $('.server_nav a').click(function(){
		    if(!$(this).hasClass('current')){
			    $('.server_nav a').removeClass('current');
			    $(this).addClass('current');
			
			    $('.s_con').hide();
			    $($(this).attr('href')).show();
		    }
			return false;
	    }); 
	
	    $(".ch_server a").click(function() {
			showServer()
		    return false;
	    });
	
	    $(".btn_sure a").click(function() {
			selectServer();
		    return false;
	    });

	    $("#fixclient").click(function () {
	        LauncherMain.ClickFixClient();
	    });
    });

    var timer = null;
    function selectServer(){
        $(".hide_wrap").hide();

        // 停止更新组定时器
	    if (timer != null) {
	        clearInterval(timer);
	        timer = null;
	    }
    }

    //alert(LauncherMain.servers.length);
    function showServer(){
        $(".hide_wrap").show();

        // 开启更新组定时器
        timer = setInterval(function () {
            var currArea = $(".t_leftCon ul li a.on5");
            if (currArea.length == 1)
                LauncherMain.RefreshGroupList(currArea.attr("data-areaid"));
        }, 30000);
    }

    $(function () {
        //鼠标选中区按钮状态
        $(".t_leftCon ul li").live("click", function (i) {
            $(".t_leftCon ul li a").removeClass("on5");
            var row = $(this).children("a");            
            row.addClass("on5");
            //setTimeout(function () { row.addClass("on5"); }, 10);

            var areaid = $(this).children("a").attr("data-areaid");
            LauncherMain.RefreshGroupList(areaid);
        });

        //鼠标选中组按钮状态
        $(".t_rightCon ul li").live("click", function (i) {
            $(".t_rightCon ul li a").removeClass("on6");
            if (!$(this).children("a").hasClass("useless")) {
                $(this).children("a").addClass("on6");
            }
        });
    });
</script>
