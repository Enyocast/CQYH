});

<script type="text/javascript">
$(document).ready(function() {
	$('.server_nav a').click(function(){
		if(!$(this).hasClass('current')){
			$('.server_nav a').removeClass('current');
			$(this).addClass('current');
			
			$('.s_con').hide();
			$($(this).attr('href')).show();
		}
			return false;
	}); 
	
	$(".ch_server a").click(function() {
			showServer()
		return false;
	});
	
	$(".btn_sure a").click(function() {
			selectServer();
		return false;
	});

});



function selectServer(){
	$(".hide_wrap").hide();
}

//alert(LauncherMain.servers.length);
function showServer(){
	$(".hide_wrap").show();
}

//鼠标选中区服按钮状态
$(".sub_sc a").live("click", function(){
		$(".sub_sc a").removeClass("current");
		$(this).addClass("current");
	});
</script>
