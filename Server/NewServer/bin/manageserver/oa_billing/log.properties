log4cplus.rootLogger=WARN,ALLFILE,STDOUT

log4cplus.logger.sap_stack=WARN,SAP
log4cplus.logger.sap_250ms=WARN,sap_250ms
log4cplus.logger.common_sdk=WARN,SDK
log4cplus.logger.sdoa_sdk=WARN,business

log4cplus.logger.seq=WARN,SEQ
log4cplus.logger.sdoa4server=WARN,SDOA
log4cplus.logger.request_sdoa=INFO,SDOAREQUEST

log4cplus.logger.bs=WARN,bs
log4cplus.additivity.bs=false

log4cplus.logger.db=WARN,db
log4cplus.additivity.db=false

log4cplus.logger.async_ptsdk=ALL,async_ptsdk
log4cplus.additivity.async_ptsdk=false


log4cplus.appender.STDOUT=log4cplus::ConsoleAppender
log4cplus.appender.STDOUT.layout=log4cplus::PatternLayout
log4cplus.appender.STDOUT.layout.ConversionPattern=%-6p[%t][%D{%m/%d/%y %H:%M:%S %Q}]%m

log4cplus.appender.ALLFILE=log4cplus::RollingFileAppender
log4cplus.appender.ALLFILE.File=./log/all.log
log4cplus.appender.ALLFILE.MaxFileSize=50000KB
log4cplus.appender.ALLFILE.MaxBackupIndex=5
log4cplus.appender.ALLFILE.layout=log4cplus::PatternLayout
log4cplus.appender.ALLFILE.layout.ConversionPattern=%-6p[%t] [%D{%m/%d/%y %H:%M:%S %Q}] %m


log4cplus.appender.SEQ=log4cplus::RollingFileAppender
log4cplus.appender.SEQ.File=./log/seq.log
log4cplus.appender.SEQ.MaxFileSize=50000KB
log4cplus.appender.SEQ.MaxBackupIndex=20
log4cplus.appender.SEQ.layout=log4cplus::PatternLayout
log4cplus.appender.SEQ.layout.ConversionPattern=%-6p[%t] [%D{%m/%d/%y %H:%M:%S %Q}] %m

log4cplus.appender.SAP=log4cplus::RollingFileAppender
